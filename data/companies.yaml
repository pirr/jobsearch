# DACH / EU tech companies with public ATS job boards, plus a global batch
# sourced from github.com/poteto/hiring-without-whiteboards (companies known
# for non-whiteboard interviews) -- many of those are US-based/US-remote, not
# DACH/EU, so check location notes on the entry before assuming EU fit.
#
# Every slug here was verified live (HTTP 200 with >0 postings). Slugs rot --
# personio, contentful, blinkist and sennder were all dead when probed -- so
# re-check with `jobsearch doctor` and prune what it reports.
#
# doctolib and parloa appear under two platforms on purpose: they exercise
# cross-source deduplication with genuinely duplicated postings.

