[project]
name = "jobsearch"
version = "0.1.0"
description = "Rank job vacancies against a candidate profile using an LLM"
requires-python = ">=3.11"
dependencies = [
    "typer>=0.12",
    "rich>=13.0",
    "httpx>=0.27",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "pypdf>=4.0",
    "python-docx>=1.1",
]

[project.optional-dependencies]
cloud = ["anthropic>=0.34"]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23"]

[project.scripts]
jobsearch = "jobsearch.cli.main:app"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
